# OpenVPN server (peer-to-peer; no NAT, no redirect-gateway).
# Installed to /etc/openvpn/server/server.conf by bootstrap.sh.
port 1194
proto udp
dev tun
topology subnet
server 10.8.0.0 255.255.252.0
ifconfig-pool-persist /var/lib/openvpn/ipp.txt
client-to-client

ca   /etc/openvpn/server/ca.crt
cert /etc/openvpn/server/server.crt
key  /etc/openvpn/server/server.key
dh none
tls-auth /etc/openvpn/server/ta.key 0
crl-verify /etc/openvpn/server/crl.pem
tls-version-min 1.2

# Clients negotiate GCM; AES-256-CBC remains the fallback for old clients.
data-ciphers AES-256-GCM:AES-128-GCM:AES-256-CBC
data-ciphers-fallback AES-256-CBC
auth SHA256

keepalive 60 600
explicit-exit-notify 1
user nobody
group nogroup
persist-key
persist-tun

# Maintains /var/lib/openvpn/hosts.d/vpn-hosts for dnsmasq.
script-security 2
learn-address /etc/openvpn/server/update-vpn-hosts.sh

management 127.0.0.1 7505
status /var/lib/openvpn/status.log 60
suppress-timestamps
verb 2
